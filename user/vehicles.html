<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Vehicles | Green Autos
</title>



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">



<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/sidebar.css">

<link rel="stylesheet" href="../css/dashboard.css">
</head>



<body>


<!-- Sidebar -->

<div id="sidebar"></div>




<!-- Main Content -->


<div class="main-content">





<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">


<div class="container-fluid">


<button class="btn btn-success d-lg-none">
<i class="bi bi-list"></i>
</button>

<h4>

<i class="bi bi-car-front-fill text-success"></i>

Vehicles Management

</h4>



<div class="dropdown">

<button class="btn btn-light dropdown-toggle"
data-bs-toggle="dropdown">

<i class="bi bi-person-circle"></i>

<span id="userName">
User
</span>

</button>

<ul class="dropdown-menu dropdown-menu-end">

<li>
<a class="dropdown-item" href="profile.html">
<i class="bi bi-person"></i>
Profile
</a>
</li>

<li><hr class="dropdown-divider"></li>

<li>
<a class="dropdown-item" href="#" onclick="logoutUser(event); return false;">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>
</li>

</ul>

</div>

<button 
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#vehicleModal">


<i class="bi bi-plus-circle"></i>

Add Vehicle


</button>



</div>


</nav>






<!-- Search -->


<div class="card shadow-sm mb-4">


<div class="card-body">


<div class="row">


<div class="col-md-6">


<input

type="text"

id="searchVehicle"

class="form-control"

placeholder="Search vehicle name or number">


</div>


</div>


</div>


</div>






<!-- Vehicle Table -->


<div class="card shadow-sm">


<div class="card-header">


<h5>

Vehicle List

</h5>


</div>



<div class="card-body table-responsive">



<table class="table table-hover">


<thead>


<tr>


<th>
#
</th>


<th>
Vehicle Name
</th>


<th>
Number Plate
</th>


<th>
Model
</th>


<th>
Driver
</th>

<th>
Owner
</th>

<th>
Status
</th>


<th>
Action
</th>



</tr>


</thead>



<tbody id="vehicleTable">


</tbody>



</table>


</div>


</div>




<!-- ==========================================
     ADD VEHICLE MODAL
========================================== -->


<div class="modal fade" id="vehicleModal">


<div class="modal-dialog modal-lg">


<div class="modal-content">



<div class="modal-header bg-success text-white">


<h5 class="modal-title">

<i class="bi bi-car-front-fill"></i>

Add Vehicle

</h5>



<button 
type="button"
class="btn-close"
data-bs-dismiss="modal">

</button>


</div>





<div class="modal-body">



<form id="vehicleForm">





<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

Vehicle Name

</label>



<input

type="text"

id="vehicleName"

class="form-control"

placeholder="Toyota Corolla"

required>


</div>






<div class="col-md-6 mb-3">


<label class="form-label">

Plate Number

</label>



<input

type="text"

id="vehicleNumber"

class="form-control"

placeholder="ABC-123"

required>


</div>






<div class="col-md-6 mb-3">


<label class="form-label">

Model

</label>



<input

type="text"

id="vehicleModel"

class="form-control"

placeholder="2024">


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Year

</label>



<input

type="number"

id="vehicleYear"

class="form-control"

placeholder="2024">


</div>





<div class="col-md-6 mb-3"> <label class="form-label"> Driver </label> <select id="vehicleDriver" class="form-select"> <option value="">Select Driver</option> </select>


</div>






<div class="col-md-6 mb-3">


<label class="form-label">

Status

</label>



<select

id="vehicleStatus"

class="form-select">


<option value="Active">
Active
</option>


<option value="Inactive">
Inactive
</option>



</select>


</div>


<div class="col-md-6 mb-3">






<div class="col-md-6 mb-3">

    <label class="form-label">
        Vehicle Owner
    </label>

    <select id="vehicleVendor" class="form-select">
        <option value="">Select Owner</option>
    </select>

</div>






</select>


</div>


</div>





</form>


</div>






<div class="modal-footer">


<button

class="btn btn-secondary"

data-bs-dismiss="modal">


Close


</button>



<button

class="btn btn-success"

onclick="saveVehicle()">



Save Vehicle


</button>


</div>





</div>


</div>


</div>








<!-- ==========================================
     JAVASCRIPT
========================================== -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/userGuard.js"></script>

<script src="../js/userSidebar.js"></script>

<script src="../js/vehicles.js"></script>

<script>

/* ==========================================
   Load Current User
========================================== */

const currentUser = getCurrentUser();
if (currentUser) {
    const userNameEl = document.getElementById('userName');
    if (userNameEl) userNameEl.innerHTML = currentUser.name || '';
}

// Use centralized logoutUser from storage.js (already exposed globally)

</script>




</body>

</html>
