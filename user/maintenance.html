<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maintenance | Green Autos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<!-- USER SIDEBAR -->

<div id="sidebar"></div>

<!-- MAIN CONTENT -->

<div class="main-content">

<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">

<div class="container-fluid">

<button class="btn btn-success d-lg-none">
<i class="bi bi-list"></i>
</button>

<div>

<h4 class="mb-0">
Maintenance Management
</h4>

<small class="text-muted">
Track vehicle maintenance
</small>

</div>

<div class="dropdown">

<button class="btn btn-light dropdown-toggle"
data-bs-toggle="dropdown">

<i class="bi bi-person-circle"></i>

<span id="userName">
User
</span>

</button>

<ul class="dropdown-menu dropdown-menu-end">

<li>
<a class="dropdown-item" href="profile.html">
<i class="bi bi-person"></i>
Profile
</a>
</li>

<li><hr class="dropdown-divider"></li>

<li>
<a class="dropdown-item" href="#" onclick="logoutUser(event); return false;">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- SEARCH AND ADD BUTTON -->

<div class="card shadow-sm mb-4">

<div class="card-body">

<div class="row">

<div class="col-md-6">

<input
type="text"
id="searchMaintenance"
class="form-control"
placeholder="Search vehicle or maintenance type">

</div>

<div class="col-md-6 text-end">

<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#maintenanceModal">
<i class="bi bi-plus-circle"></i>
Add Maintenance
</button>

</div>

</div>

</div>

</div>

<!-- MAINTENANCE TABLE -->

<div class="card shadow-sm">

<div class="card-header">

<h5>
<i class="bi bi-tools"></i>
Maintenance History
</h5>

</div>

<div class="card-body table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>#</th>
<th>Vehicle</th>
<th>Type</th>
<th>Description</th>
<th>Cost</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="maintenanceTable">

<tr>

<td colspan="8" class="text-center text-muted">

No Maintenance Records Found

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- ADD MAINTENANCE MODAL -->

<div class="modal fade" id="maintenanceModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header bg-success text-white">

<h5 class="modal-title">

<i class="bi bi-tools"></i>

Add Maintenance

</h5>

<button 
type="button"
class="btn-close"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<form id="maintenanceForm">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Vehicle
</label>

<select
id="maintenanceVehicle"
class="form-select"
required>

<option value="">Select Vehicle</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Maintenance Type
</label>

<select
id="maintenanceType"
class="form-select"
required>

<option value="">Select Type</option>
<option value="Oil Change">Oil Change</option>
<option value="Tire Replacement">Tire Replacement</option>
<option value="Battery">Battery</option>
<option value="Brake Service">Brake Service</option>
<option value="Engine Repair">Engine Repair</option>
<option value="General Service">General Service</option>
<option value="Other">Other</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label class="form-label">
Description
</label>

<textarea
id="maintenanceDescription"
class="form-control"
placeholder="Maintenance details"
rows="3"
required></textarea>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Cost (PKR)
</label>

<input
type="number"
id="maintenanceCost"
class="form-control"
placeholder="1000"
step="0.01"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Date
</label>

<input
type="date"
id="maintenanceDate"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Technician
</label>

<input
type="text"
id="maintenanceTechnician"
class="form-control"
placeholder="Technician name">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Status
</label>

<select
id="maintenanceStatus"
class="form-select">

<option value="Completed">Completed</option>
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>

</select>

</div>

</div>

</form>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Close

</button>

<button
class="btn btn-success"
onclick="handleSaveMaintenance()">

Save Maintenance

</button>

</div>

</div>

</div>

</div>

<!-- FOOTER -->

<footer class="mt-5 py-3 text-center text-muted">

<p class="mb-0">

© 2026 Green Autos Fleet Management System

</p>

</footer>

</div>

<!-- END MAIN CONTENT -->

<!-- JAVASCRIPT FILES -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/userGuard.js"></script>
<script src="../js/userSidebar.js"></script>

<script>

// Initialize page state and wire storage sync
(function(){
    const user = window.getCurrentUser && window.getCurrentUser();
    if(user) {
        const nameEl = document.getElementById("userName");
        if(nameEl) nameEl.innerText = user.name || user.username || "User";
    }

    // Local cached lists (kept in sync via storageSync)
    let maintenanceRecords = window.getMaintenance ? window.getMaintenance() : [];
    let vehicleList = window.getVehicles ? window.getVehicles() : [];
    let editMode = false;
    let editId = null;
    const maintenanceTable = document.getElementById("maintenanceTable");
    const maintenanceModal = document.getElementById("maintenanceModal");

    function renderMaintenance(){
        if(!maintenanceTable) return;
        if(!Array.isArray(maintenanceRecords) || maintenanceRecords.length === 0){
            maintenanceTable.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No Maintenance Records Found</td></tr>`;
            return;
        }
        maintenanceTable.innerHTML = "";
        maintenanceRecords.forEach((rec, idx) => {
            const vehicleName = rec.vehicleName || ((vehicleList.find(v => String(v.id) === String(rec.vehicleId)) || {}).name) || rec.vehicle || "-";
            const statusClass = rec.status === "Completed" ? "success" : rec.status === "Pending" ? "secondary" : "info";
            maintenanceTable.insertAdjacentHTML('beforeend', `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${vehicleName}</td>
                    <td>${rec.type}</td>
                    <td>${rec.description}</td>
                    <td>PKR ${Number(rec.cost || 0).toFixed(2)}</td>
                    <td>${rec.date}</td>
                    <td><span class="badge bg-${statusClass}">${rec.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editMaintenanceRecord('${rec.id}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteMaintenanceRecord('${rec.id}')"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `);
        });
    }

    function renderVehicles(){
        const sel = document.getElementById("maintenanceVehicle");
        if(!sel) return;
        sel.innerHTML = '<option value="">Select Vehicle</option>';
        vehicleList.forEach(v => {
            sel.insertAdjacentHTML('beforeend', `<option value="${v.id}">${v.name} (${v.number})</option>`);
        });
    }

    function resetMaintenanceForm(){
        const form = document.getElementById("maintenanceForm");
        if(form) form.reset();
        editMode = false;
        editId = null;
        const submitButton = document.querySelector('#maintenanceModal .btn-success');
        if(submitButton) submitButton.innerText = 'Save Maintenance';
        const titleEl = maintenanceModal ? maintenanceModal.querySelector('.modal-title') : null;
        if(titleEl) titleEl.innerText = 'Add Maintenance';
    }

    // Save handler (uses centralized save)
    window.handleSaveMaintenance = function(){
        const vehicleId = document.getElementById("maintenanceVehicle").value;
        const type = document.getElementById("maintenanceType").value;
        const description = document.getElementById("maintenanceDescription").value.trim();
        const cost = document.getElementById("maintenanceCost").value;
        const date = document.getElementById("maintenanceDate").value;
        const technician = document.getElementById("maintenanceTechnician").value.trim();
        const status = document.getElementById("maintenanceStatus").value;

        if(!vehicleId || !type || !description || !cost || !date){
            alert("Please fill all required fields");
            return;
        }

        const vehicle = vehicleList.find(v => String(v.id) === String(vehicleId)) || {};
        const rec = {
            id: editMode ? editId : Date.now(),
            vehicleId: vehicleId,
            vehicleName: vehicle.name || "",
            type: type,
            description: description,
            cost: Number(cost),
            date: date,
            technician: technician,
            status: status || "Pending",
            vendorId: vehicle.vendorId || null
        };

        const all = window.getMaintenance ? window.getMaintenance() : [];
        if(editMode){
            const updated = all.map(record => String(record.id) === String(editId) ? Object.assign({}, record, rec) : record);
            if(window.saveMaintenance) window.saveMaintenance(updated);
            if(window.addActivityLog) window.addActivityLog("Maintenance", `Updated maintenance for ${rec.vehicleName || vehicleId}`);
        } else {
            all.push(rec);
            if(window.saveMaintenance) window.saveMaintenance(all);
            if(window.addActivityLog) window.addActivityLog("Maintenance", `Added maintenance for ${rec.vehicleName || vehicleId}`);
        }

        resetMaintenanceForm();
        if(maintenanceModal){
            try { const modal = bootstrap.Modal.getInstance(maintenanceModal); if(modal) modal.hide(); } catch(e) {}
        }
        // local state will refresh on storageSync
    };

    window.deleteMaintenanceRecord = function(id){
        if(!confirm("Delete this maintenance record?")) return;
        const all = (window.getMaintenance ? window.getMaintenance() : []).filter(r => String(r.id) !== String(id));
        if(window.saveMaintenance) window.saveMaintenance(all);
        if(window.addActivityLog) window.addActivityLog("Maintenance", `Deleted maintenance record`);
        if(maintenanceModal){
            // if a delete happened while modal open, ensure state remains clean
            resetMaintenanceForm();
        }
        if(window.triggerStorageSync) triggerStorageSync(StorageKeys.MAINTENANCE);
    };

    window.editMaintenanceRecord = function(id){
        const all = window.getMaintenance ? window.getMaintenance() : [];
        const rec = all.find(item => String(item.id) === String(id));
        if(!rec) return;
        editMode = true;
        editId = rec.id;
        document.getElementById("maintenanceVehicle").value = rec.vehicleId || rec.vehicle || "";
        document.getElementById("maintenanceType").value = rec.type || "";
        document.getElementById("maintenanceDescription").value = rec.description || "";
        document.getElementById("maintenanceCost").value = rec.cost || "";
        document.getElementById("maintenanceDate").value = rec.date || "";
        document.getElementById("maintenanceTechnician").value = rec.technician || "";
        document.getElementById("maintenanceStatus").value = rec.status || "Pending";

        const submitButton = document.querySelector('#maintenanceModal .btn-success');
        if(submitButton) submitButton.innerText = 'Update Record';
        if(maintenanceModal){
            const titleEl = maintenanceModal.querySelector('.modal-title');
            if(titleEl) titleEl.innerText = 'Edit Maintenance';
            try { new bootstrap.Modal(maintenanceModal).show(); } catch(e) {}
        }
    };

    if(maintenanceModal){
        maintenanceModal.addEventListener('hidden.bs.modal', function(){
            resetMaintenanceForm();
        });
    }

    // Search
    const searchInput = document.getElementById("searchMaintenance");
    if(searchInput){
        searchInput.addEventListener('keyup', function(e){
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('#maintenanceTable tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        });
    }

    // Initial render
    renderVehicles();
    renderMaintenance();

    // Listen for centralized storage updates and refresh local caches
    window.addEventListener('storageSync', (ev) => {
        const key = ev && ev.detail && ev.detail.key;
        if(!key) return;
        if([StorageKeys.MAINTENANCE, StorageKeys.VEHICLES, StorageKeys.CURRENT_USER].includes(key)){
            maintenanceRecords = window.getMaintenance ? window.getMaintenance() : [];
            vehicleList = window.getVehicles ? window.getVehicles() : [];
            renderVehicles();
            renderMaintenance();
        }
    });
})();

</script>

</body>

</html>
