<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activity Log | Green Autos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<!-- USER SIDEBAR -->

<div id="sidebar"></div>

<!-- MAIN CONTENT -->

<div class="main-content">

<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">

<div class="container-fluid">

<button class="btn btn-success d-lg-none">
<i class="bi bi-list"></i>
</button>

<div>

<h4 class="mb-0">
Activity Log
</h4>

<small class="text-muted">
Track all system activities and changes
</small>

</div>

<div class="dropdown">

<button class="btn btn-light dropdown-toggle"
data-bs-toggle="dropdown">

<i class="bi bi-person-circle"></i>

<span id="userName">
User
</span>

</button>

<ul class="dropdown-menu dropdown-menu-end">

<li>
<a class="dropdown-item" href="profile.html">
<i class="bi bi-person"></i>
Profile
</a>
</li>

<li><hr class="dropdown-divider"></li>

<li>
<a class="dropdown-item" href="#" onclick="logoutUser(event); return false;">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- FILTER OPTIONS -->

<div class="card shadow-sm mb-4">

<div class="card-body">

<div class="row">

<div class="col-md-4">

<label class="form-label">Filter by Action Type</label>

<select id="filterAction" class="form-select">

<option value="">All Actions</option>
<option value="Create">Create</option>
<option value="Update">Update</option>
<option value="Delete">Delete</option>
<option value="Login">Login</option>
<option value="Logout">Logout</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">Filter by Date</label>

<input type="date" id="filterDate" class="form-control">

</div>

<div class="col-md-4">

<label class="form-label">Search</label>

<input
type="text"
id="searchActivity"
class="form-control"
placeholder="Search activities">

</div>

</div>

</div>

</div>

<!-- ACTIVITY TABLE -->

<div class="card shadow-sm">

<div class="card-header">

<h5>
<i class="bi bi-clock-history"></i>
Activity Log
</h5>

</div>

<div class="card-body table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>#</th>
<th>Date & Time</th>
<th>User</th>
<th>Action</th>
<th>Message</th>
<th>Type</th>

</tr>

</thead>

<tbody id="activityTable">

<tr>

<td colspan="6" class="text-center text-muted">

No Activity Found

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- FOOTER -->

<footer class="mt-5 py-3 text-center text-muted">

<p class="mb-0">

© 2026 Green Autos Fleet Management System

</p>

</footer>

</div>

<!-- END MAIN CONTENT -->

<!-- JAVASCRIPT FILES -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/userGuard.js"></script>
<script src="../js/userSidebar.js"></script>

<script>
(function(){
    const user = window.getCurrentUser && window.getCurrentUser();
    if(user){
        const el = document.getElementById('userName');
        if(el) el.innerText = user.name || user.username || 'User';
    }

    let activities = window.getStorageData ? window.getStorageData(StorageKeys.ACTIVITY_LOGS, []) : [];
    const table = document.getElementById('activityTable');

    function renderActivities(list){
        const display = Array.isArray(list) ? list : [];
        if(!table) return;
        if(display.length === 0){
            table.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No Activity Found</td></tr>';
            return;
        }
        table.innerHTML = '';
        display.forEach((activity, i) => {
            let actionColor = 'success';
            if(activity.type === 'Delete') actionColor = 'danger';
            if(activity.type === 'Update') actionColor = 'warning';
            if(activity.type === 'Login') actionColor = 'info';
            table.insertAdjacentHTML('beforeend', `
                <tr>
                    <td>${i+1}</td>
                    <td>${activity.date}</td>
                    <td>${activity.user}</td>
                    <td>${activity.action || activity.type}</td>
                    <td>${activity.message}</td>
                    <td><span class="badge bg-${actionColor}">${activity.type}</span></td>
                </tr>
            `);
        });
    }

    renderActivities(activities);

    function filterActivities(){
        const actionFilter = (document.getElementById('filterAction').value || '').toLowerCase();
        const dateFilter = document.getElementById('filterDate').value || '';
        const searchFilter = (document.getElementById('searchActivity').value || '').toLowerCase();
        const filtered = activities.filter(a => {
            const matchAction = !actionFilter || String(a.type || '').toLowerCase().includes(actionFilter);
            const matchDate = !dateFilter || String(a.date || '').includes(dateFilter);
            const hay = ((a.user||'') + ' ' + (a.message||'') + ' ' + (a.action||'')).toLowerCase();
            const matchSearch = !searchFilter || hay.includes(searchFilter);
            return matchAction && matchDate && matchSearch;
        });
        renderActivities(filtered);
    }

    document.getElementById('filterAction').addEventListener('change', filterActivities);
    document.getElementById('filterDate').addEventListener('change', filterActivities);
    document.getElementById('searchActivity').addEventListener('keyup', filterActivities);

    // periodic refresh + centralized storage sync
    const refresh = () => {
        activities = window.getStorageData ? window.getStorageData(StorageKeys.ACTIVITY_LOGS, []) : [];
        renderActivities(activities);
    };
    const intervalId = setInterval(refresh, 5000);

    window.addEventListener('storageSync', (ev) => {
        const key = ev && ev.detail && ev.detail.key;
        if(!key) return;
        if(key === StorageKeys.ACTIVITY_LOGS || key === StorageKeys.CURRENT_USER){
            refresh();
        }
    });

})();
</script>

</body>

</html>
