<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Profile | Green Autos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/vendor.css">
</head>

<body>
<div id="sidebar"></div>
<div class="main-content">
<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">
<div class="container-fluid">
<button class="btn btn-success d-lg-none"><i class="bi bi-list"></i></button>
<div>
<h4 class="mb-0">Vendor Profile</h4>
<small class="text-muted">View and update your profile information.</small>
</div>
<div class="dropdown">
<button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
<i class="bi bi-person-circle"></i>
<span id="userName">Vendor</span>
</button>
<ul class="dropdown-menu dropdown-menu-end">
<li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
<li><hr class="dropdown-divider"></li>
<li><a class="dropdown-item" href="#" onclick="logoutUser(event); return false;"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
</ul>
</div>
</div>
</nav>
<div class="row g-4">
<div class="col-lg-4">
<div class="card shadow-sm profile-card">
<div class="card-body">
<h5 class="mb-4">Account Summary</h5>
<ul class="list-group list-group-flush">
<li class="list-group-item"><strong>Name:</strong> <span id="profileName">-</span></li>
<li class="list-group-item"><strong>Email:</strong> <span id="profileEmail">-</span></li>
<li class="list-group-item"><strong>Phone:</strong> <span id="profilePhone">-</span></li>
<li class="list-group-item"><strong>Company:</strong> <span id="profileCompany">-</span></li>
<li class="list-group-item"><strong>Role:</strong> Vendor</li>
</ul>
</div>
</div>
</div>
<div class="col-lg-8">
<div class="card shadow-sm profile-form-card">
<div class="card-header bg-success text-white"><h5 class="mb-0">Edit Profile</h5></div>
<div class="card-body">
<form id="profileForm">
<div class="row g-3">
<div class="col-md-6">
<label class="form-label">Full Name</label>
<input id="name" type="text" class="form-control" required>
</div>
<div class="col-md-6">
<label class="form-label">Email</label>
<input id="email" type="email" class="form-control" required>
</div>
<div class="col-md-6">
<label class="form-label">Phone</label>
<input id="phone" type="tel" class="form-control" required>
</div>
<div class="col-md-6">
<label class="form-label">Company</label>
<input id="company" type="text" class="form-control">
</div>
<div class="col-12">
<button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Update Profile</button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>
<script src="../js/vendorGuard.js"></script>
<script src="../js/vendorSidebar.js"></script>
<script src="../js/vendorProfile.js"></script>
</body>
</html>
