<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vehicles | Green Autos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/vendor.css">
</head>

<body>
<div id="sidebar"></div>
<div class="main-content">
<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">
<div class="container-fluid">
<button class="btn btn-success d-lg-none"><i class="bi bi-list"></i></button>
<div>
<h4 class="mb-0">My Vehicles</h4>
<small class="text-muted">Review and monitor the vehicles assigned to your account.</small>
</div>
<div class="dropdown">
<button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
<i class="bi bi-person-circle"></i>
<span id="userName">Vendor</span>
</button>
<ul class="dropdown-menu dropdown-menu-end">
<li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
<li><hr class="dropdown-divider"></li>
<li><a class="dropdown-item" href="#" onclick="logoutUser(event); return false;"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
</ul>
</div>
</div>
</nav>
<div class="card shadow-sm mb-4">
<div class="card-body">
<div class="row align-items-center">
<div class="col-md-6">
<h5 class="mb-0">Assigned Vehicles</h5>
</div>
<div class="col-md-6 text-md-end mt-3 mt-md-0">
<input id="searchVehicle" type="text" class="form-control" placeholder="Search vehicle name, plate or model">
</div>
</div>
</div>
</div>
<div class="card shadow-sm vendor-table">
<div class="card-header"><h5 class="mb-0">Vehicle List</h5></div>
<div class="card-body table-responsive">
<table class="table table-hover align-middle">
<thead>
<tr>
<th>#</th>
<th>Vehicle Name</th>
<th>Number Plate</th>
<th>Model</th>
<th>Driver</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="vehiclesTable">
<tr><td colspan="7" class="text-center vendor-empty">No assigned vehicles found.</td></tr>
</tbody>
</table>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>
<script src="../js/vendorGuard.js"></script>
<script src="../js/vendorSidebar.js"></script>
<script src="../js/vendorVehicles.js"></script>
</body>
</html>
