<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Requests | Green Autos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/vendor.css">
</head>

<body>
<div id="sidebar"></div>
<div class="main-content">
<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">
<div class="container-fluid">
<button class="btn btn-success d-lg-none"><i class="bi bi-list"></i></button>
<div>
<h4 class="mb-0">Maintenance Requests</h4>
<small class="text-muted">Track issues and submit new maintenance requests for your vehicles.</small>
</div>
<div class="dropdown">
<button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
<i class="bi bi-person-circle"></i>
<span id="userName">Vendor</span>
</button>
<ul class="dropdown-menu dropdown-menu-end">
<li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
<li><hr class="dropdown-divider"></li>
<li><a class="dropdown-item" href="#" onclick="logoutUser(event); return false;"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
</ul>
</div>
</div>
</nav>
<div class="row g-4">
<div class="col-lg-5">
<div class="card shadow-sm vendor-form">
<div class="card-header bg-success text-white">
<h5 class="mb-0">Create Maintenance Request</h5>
</div>
<div class="card-body">
<form id="maintenanceForm">
<div class="mb-3">
<label class="form-label">Vehicle</label>
<select id="vehicleSelect" class="form-select"></select>
</div>
<div class="mb-3">
<label class="form-label">Issue</label>
<input id="issue" type="text" class="form-control" placeholder="Describe the issue">
</div>
<div class="row g-3">
<div class="col-md-6">
<label class="form-label">Request Date</label>
<input id="requestDate" type="date" class="form-control">
</div>
<div class="col-md-6">
<label class="form-label">Estimated Cost</label>
<input id="requestCost" type="number" class="form-control" placeholder="Amount">
</div>
</div>
<div class="mb-3 mt-3">
<label class="form-label">Status</label>
<select id="requestStatus" class="form-select">
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>
</div>
<button class="btn btn-success w-100" type="submit"><i class="bi bi-plus-circle"></i> Submit Request</button>
</form>
</div>
</div>
</div>
<div class="col-lg-7">
<div class="card shadow-sm vendor-table">
<div class="card-header"><h5 class="mb-0">Request Queue</h5></div>
<div class="card-body table-responsive">
<table class="table table-hover align-middle">
<thead>
<tr>
<th>#</th>
<th>Vehicle</th>
<th>Issue</th>
<th>Request Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="maintenanceTable">
<tr><td colspan="6" class="text-center vendor-empty">No maintenance requests yet.</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>
<script src="../js/vendorGuard.js"></script>
<script src="../js/vendorSidebar.js"></script>
<script src="../js/vendorMaintenance.js"></script>
</body>
</html>
