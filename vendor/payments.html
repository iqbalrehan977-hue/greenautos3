<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Payments | Green Autos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/vendor.css">
</head>

<body>
<div id="sidebar"></div>
<div class="main-content">
<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">
<div class="container-fluid">
<button class="btn btn-success d-lg-none"><i class="bi bi-list"></i></button>
<div>
<h4 class="mb-0">Payments</h4>
<small class="text-muted">Track your vendor earnings and payment history.</small>
</div>
<div class="dropdown">
<button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
<i class="bi bi-person-circle"></i>
<span id="userName">Vendor</span>
</button>
<ul class="dropdown-menu dropdown-menu-end">
<li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
<li><hr class="dropdown-divider"></li>
<li><a class="dropdown-item" href="#" onclick="logoutUser(event); return false;"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
</ul>
</div>
</div>
</nav>
<div class="row g-4">
<div class="col-lg-4 col-md-6">
<div class="card shadow-sm">
<div class="card-body">
<h6>Total Earnings</h6>
<h2 id="earningTotal">Rs 0</h2>
</div>
</div>
</div>
<div class="col-lg-4 col-md-6">
<div class="card shadow-sm">
<div class="card-body">
<h6>Payments Received</h6>
<h2 id="paymentCount">0</h2>
</div>
</div>
</div>
<div class="col-lg-4 col-md-12">
<div class="card shadow-sm">
<div class="card-body">
<h6>Pending Payments</h6>
<h2 id="pendingPayments">0</h2>
</div>
</div>
</div>
</div>
<div class="card shadow-sm vendor-table mt-4">
<div class="card-header"><h5 class="mb-0">Payment Records</h5></div>
<div class="card-body table-responsive">
<table class="table table-hover align-middle">
<thead>
<tr>
<th>#</th>
<th>Date</th>
<th>Vehicle</th>
<th>Amount</th>
<th>Payment Status</th>
</tr>
</thead>
<tbody id="paymentTable">
<tr><td colspan="5" class="text-center vendor-empty">No payment records yet.</td></tr>
</tbody>
</table>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>
<script src="../js/vendorGuard.js"></script>
<script src="../js/vendorSidebar.js"></script>
<script src="../js/vendorPayments.js"></script>
</body>
</html>
