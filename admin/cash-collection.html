<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cash Collection | Green Autos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="../css/sidebar.css">

<link rel="stylesheet"
href="../css/dashboard.css">

</head>

<body>

<!-- Sidebar -->

<div id="sidebar"></div>

<!-- Main Content -->

<div class="main-content">

<nav class="navbar bg-white shadow-sm mb-4">

<div class="container-fluid">

<h4>

<i class="bi bi-wallet2 text-success"></i>

Cash Collection

</h4>

<button

class="btn btn-success"

data-bs-toggle="modal"

data-bs-target="#cashModal">

<i class="bi bi-plus-circle"></i>

New Collection

</button>

</div>

</nav>

<!-- Search -->

<div class="card shadow-sm mb-4">

<div class="card-body">

<input

type="text"

id="searchCash"

class="form-control"

placeholder="Search by Driver, Vehicle or Date">

</div>

</div>

<!-- Table -->

<div class="card shadow-sm">

<div class="card-header">

<h5>

Cash Collection History

</h5>

</div>

<div class="card-body table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>#</th>

<th>Date</th>

<th>Vehicle</th>

<th>Driver</th>

<th>Amount</th>

<th>Remarks</th>

<th>Action</th>

</tr>

</thead>

<tbody id="cashTable">

</tbody>

</table>

</div>

</div>
<!-- ==========================================
     CASH COLLECTION MODAL
========================================== -->

<div class="modal fade" id="cashModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header bg-success text-white">

<h5 class="modal-title">

<i class="bi bi-wallet2"></i>

Cash Collection

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="cashForm">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Collection Date

</label>

<input
type="date"
id="cashDate"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Vehicle

</label>

<select
id="cashVehicle"
class="form-select"
required>

<option value="">

Select Vehicle

</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Driver

</label>

<select
id="cashDriver"
class="form-select"
required>

<option value="">

Select Driver

</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Amount (PKR)

</label>

<input
type="number"
id="cashAmount"
class="form-control"
placeholder="Enter Amount"
required>

</div>

<div class="col-12 mb-3">

<label class="form-label">

Remarks

</label>

<textarea
id="cashRemarks"
class="form-control"
rows="3"
placeholder="Enter Remarks"></textarea>

</div>

</div>

</form>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Close

</button>

<button
class="btn btn-success"
onclick="saveCash()">

Save Collection

</button>

</div>

</div>

</div>

</div>
<!-- ==========================================
     JAVASCRIPT FILES
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>

<!-- Sidebar -->
<script src="../js/adminSidebar.js"></script>

<!-- Cash Collection -->
<script src="../js/cash-Collection.js"></script>

</body>

</html>
