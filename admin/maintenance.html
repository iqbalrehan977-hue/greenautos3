<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maintenance | Green Autos</title>


<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Custom CSS -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/dashboard.css">


</head>


<body>


<!-- Sidebar Container -->

<div id="adminSidebar"></div>



<!-- Main Area -->

<div class="main-content">


<!-- Top Header -->

<div class="page-header">

<h2>
Maintenance Management
</h2>

<p>
Manage vehicle repairs, service records and expenses
</p>

</div>



<!-- Dashboard Cards -->

<div class="row g-4">


<div class="col-md-4">

<div class="card dashboard-card">

<div class="card-body">

<h6>
Total Maintenance
</h6>

<h2 id="totalMaintenance">
0
</h2>

</div>

</div>

</div>



<div class="col-md-4">

<div class="card dashboard-card">

<div class="card-body">

<h6>
Pending Services
</h6>

<h2 id="pendingService">
0
</h2>

</div>

</div>

</div>



<div class="col-md-4">

<div class="card dashboard-card">

<div class="card-body">

<h6>
Total Cost
</h6>

<h2 id="totalCost">
0
</h2>

</div>

</div>

</div>


</div>


<!-- Next Part Here -->

<!-- Add Maintenance Section -->


<div class="card shadow mt-4">


<div class="card-header bg-success text-white">

<h5 class="mb-0">
Add New Maintenance Record
</h5>

</div>



<div class="card-body">


<form id="maintenanceForm">



<div class="row g-3">



<!-- Vehicle -->

<div class="col-md-6">

<label class="form-label">
Select Vehicle
</label>


<select 
class="form-select"
id="vehicleSelect">


<option value="">
Choose Vehicle
</option>


</select>


</div>





<!-- Maintenance Type -->

<div class="col-md-6">

<label class="form-label">
Maintenance Type
</label>


<select 
class="form-select"
id="maintenanceType">


<option>
Engine Service
</option>

<option>
Oil Change
</option>

<option>
Repair
</option>

<option>
Tyre Replacement
</option>

<option>
Other
</option>


</select>


</div>





<!-- Date -->

<div class="col-md-4">


<label class="form-label">
Maintenance Date
</label>


<input 
type="date"
class="form-control"
id="maintenanceDate">


</div>





<!-- Cost -->

<div class="col-md-4">


<label class="form-label">
Maintenance Cost
</label>


<input 
type="number"
class="form-control"
id="maintenanceAmount"
placeholder="Enter cost">


</div>





<!-- Status -->

<div class="col-md-4">


<label class="form-label">
Status
</label>


<select 
class="form-select"
id="maintenanceStatus">


<option>
Completed
</option>


<option>
Pending
</option>


<option>
In Progress
</option>


</select>


</div>





<!-- Description -->

<div class="col-12">


<label class="form-label">
Description
</label>


<textarea 
class="form-control"
id="maintenanceDescription"
rows="3"
placeholder="Enter details about maintenance">
</textarea>


</div>



</div>





<div class="mt-4">


<button 
type="submit"
class="btn btn-success px-4">

Save Record

</button>


<button 
type="reset"
class="btn btn-secondary ms-2">

Clear

</button>


</div>




</form>


</div>


</div> 
<!-- Maintenance Records Section -->


<div class="card shadow mt-4">


<div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">


<h5 class="mb-0">
Maintenance History
</h5>


<input 
type="text"
class="form-control w-25"
id="searchMaintenance"
placeholder="Search record...">


</div>





<div class="card-body">



<div class="table-responsive">


<table class="table table-hover align-middle">


<thead class="table-success">


<tr>

<th>#</th>

<th>Vehicle</th>

<th>Type</th>

<th>Date</th>

<th>Cost</th>

<th>Status</th>

<th>Description</th>

<th>Action</th>


</tr>


</thead>



<tbody id="maintenanceTable">


<!-- Records will load here by JS -->


</tbody>



</table>


</div>



</div>


</div>







<!-- Edit Maintenance Modal -->


<div class="modal fade" id="editMaintenanceModal" tabindex="-1">


<div class="modal-dialog">


<div class="modal-content">


<div class="modal-header bg-success text-white">


<h5 class="modal-title">
Edit Maintenance
</h5>


<button 
type="button"
class="btn-close"
data-bs-dismiss="modal">

</button>


</div>





<div class="modal-body">


<input type="hidden" id="editMaintenanceId">



<label class="form-label">
Cost
</label>


<input 
type="number"
class="form-control mb-3"
id="editCost">





<label class="form-label">
Status
</label>


<select 
class="form-select"
id="editStatus">


<option>
Completed
</option>


<option>
Pending
</option>


<option>
In Progress
</option>


</select>



</div>





<div class="modal-footer">


<button 
class="btn btn-secondary"
data-bs-dismiss="modal">

Close

</button>



<button 
class="btn btn-success"
id="updateMaintenanceBtn">

Update

</button>



</div>


</div>


</div>


</div>
<!-- Page Footer -->


<div class="mt-5 text-center text-muted">

<p>
© 2026 Green Autos Fleet Management System
</p>

</div>



</div>
<!-- End Main Content -->





<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/storage.js"></script>



<!-- Sidebar JS -->

<script src="../js/adminSidebar.js"></script>



<!-- Maintenance JS -->

<script src="../js/maintenance.js"></script>



</body>

</html>
